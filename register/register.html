<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veniffée - Register</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="login-container">
  <h1>Veniffée</h1>
  <p>Create your account</p>

  <input type="text" id="regName" placeholder="Full Name">

  <input type="email" id="regEmail" placeholder="Email (example@mail.com)">
  <input type="password" id="regPass" placeholder="Password (min 8 characters)">

  <button id="regBtn">Register</button>

  <p id="msg"></p>

  <a href="login.html" class="back-link">Back to Login</a>
</div>

<script src="register.js"></script>
</body>
</html>
